<div
  class="max-w-7xl mx-auto mt-8 mb-12 p-8 bg-white rounded-2xl shadow-2xl border border-slate-100"
>
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Editor de plantilla</h1>
      <p class="text-slate-500 mt-1 text-lg">Crea y previsualiza en tiempo real.</p>
    </div>

    <button
      (click)="saveContent()"
      class="inline-flex items-center px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-all duration-200 transform hover:scale-105 shadow-lg active:scale-95"
    >
      Guardar Cambios
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-slate-50 rounded-xl p-1 border border-slate-200 overflow-hidden">
      <angular-editor
        [ngModel]="htmlContent"
        (ngModelChange)="actualizarVistaPrevia($event)"
        [config]="config"
      >
      </angular-editor>
    </div>

    <div class="space-y-2">
      <label class="text-sm font-bold text-slate-700 uppercase tracking-wider">Vista Previa</label>

      <div
        class="preview-container bg-white border-2 border-dashed border-slate-200 rounded-xl p-6 min-h-[34rem] max-h-[60rem] overflow-y-auto"
      >
        <header class="border-b border-slate-200 px-6 py-4 bg-slate-50">
          <h2 class="text-lg font-bold text-slate-800 flex justify-center">
            Felicidades, eres un nuevo aspirante
          </h2>
          <p class="text-sm text-slate-500 flex justify-center">
            ¿Cuáles son los siguientes pasos?
          </p>
        </header>
        <div [innerHTML]="htmlContent | safeHtml"></div>
        <footer class="border-t border-slate-200 px-6 py-3 bg-slate-50 text-center">
          <p class="text-xs text-slate-500">© 2026 · ANUIES</p>
        </footer>
      </div>
    </div>
  </div>
</div>
