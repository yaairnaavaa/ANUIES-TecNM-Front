<div class="fixed top-6 right-6 z-[120] flex flex-col gap-3 w-full max-w-sm">
  @if (errorMessage()) {
    <div
      class="flex items-center gap-4 p-4 bg-white border-l-4 border-red-500 shadow-2xl rounded-2xl animate-slide-in-right"
    >
      <div
        class="w-10 h-10 bg-red-50 text-red-500 rounded-full flex items-center justify-center shrink-0"
      >
        <i class="fas fa-exclamation-circle text-lg"></i>
      </div>
      <div class="flex-1">
        <p
          class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1"
        >
          Error
        </p>
        <p class="text-sm font-bold text-slate-700 leading-tight">{{ errorMessage() }}</p>
      </div>
      <button
        (click)="errorMessage.set(null)"
        class="text-slate-300 hover:text-slate-500 transition-colors"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
  }

  @if (successMessage()) {
    <div
      class="flex items-center gap-4 p-4 bg-white border-l-4 border-emerald-600 shadow-2xl rounded-2xl animate-slide-in-right"
    >
      <div
        class="w-10 h-10 bg-slate-50 text-emerald-600  rounded-full flex items-center justify-center shrink-0"
      >
        <i class="fas fa-check-circle text-lg"></i>
      </div>
      <div class="flex-1">
        <p
          class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1"
        >
          Éxito
        </p>
        <p class="text-sm font-bold text-slate-700 leading-tight">{{ successMessage() }}</p>
      </div>
      <button
        (click)="successMessage.set(null)"
        class="text-slate-300 hover:text-slate-500 transition-colors"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>
  }
</div>

<div class="fixed inset-0 z-[110] flex items-center justify-center p-4 md:p-8 animate-fade-in">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" (click)="onClose.emit()"></div>

  <div
    class="relative w-full max-w-4xl max-h-[95vh] overflow-y-auto bg-white rounded-[3rem] shadow-2xl animate-slide-up border border-slate-100"
  >
    <div
      class="sticky top-0 z-10 flex items-center justify-between p-8 bg-white/80 backdrop-blur-md border-b border-slate-100"
    >
      <div class="flex items-center gap-5">
        <div
          class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white shadow-lg"
        >
          <i class="fas fa-university text-xl"></i>
        </div>
        <div>
          <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">
            Editar Institución
          </h2>
          <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">{{ ies?.name }}</p>
        </div>
      </div>
      <button
        (click)="onClose.emit()"
        class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-all"
      >
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <div class="p-8 bg-white">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Nombre de la IES</label
          >
          <div class="relative">
            <i class="fas fa-school absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input
              [(ngModel)]="ies!.name"
              type="text"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-slate-500/5 focus:border-slate-400 outline-none transition-all font-medium text-slate-700"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Responsable</label
          >
          <div class="relative">
            <i class="fas fa-user-tie absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input
              [(ngModel)]="ies!.contact.responsable"
              type="text"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-slate-500/5 focus:border-slate-400 outline-none transition-all font-medium text-slate-700"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Director</label
          >
          <div class="relative">
            <i
              class="fas fa-user-graduate absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"
            ></i>
            <input
              [(ngModel)]="ies!.contact.nombreDirector"
              type="text"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-slate-500/5 focus:border-slate-400 outline-none transition-all font-medium text-slate-700"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Email de contacto</label
          >
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input
              [(ngModel)]="ies!.contact.email"
              type="email"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-slate-500/5 focus:border-slate-400 outline-none transition-all font-medium text-slate-700"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Teléfono General</label
          >
          <div class="relative">
            <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input
              [(ngModel)]="ies!.contact.generalPhone"
              type="tel"
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-slate-500/5 focus:border-slate-400 outline-none transition-all font-medium text-slate-700"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1"
            >Estado del Registro</label
          >
          <div
            (click)="ies!.active = !ies!.active"
            class="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-100 rounded-2xl cursor-pointer hover:bg-slate-100 transition-colors"
          >
            <div class="flex items-center gap-3">
              <div
                [class]="ies!.active ? 'bg-emerald-500' : 'bg-slate-300'"
                class="w-2 h-2 rounded-full shadow-[0_0_8px_rgba(0,0,0,0.1)] transition-colors"
              ></div>
              <span class="text-sm font-bold text-slate-600">{{
                ies!.active ? 'Institución Activa' : 'Institución Inactiva'
              }}</span>
            </div>

            <div
              class="relative inline-flex items-center h-6 rounded-full w-11 transition-colors outline-none"
              [class.bg-slate-800]="ies!.active"
              [class.bg-slate-200]="!ies!.active"
            >
              <span
                class="inline-block w-4 h-4 transform bg-white rounded-full transition-transform duration-200 ease-in-out"
                [class.translate-x-6]="ies!.active"
                [class.translate-x-1]="!ies!.active"
              >
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-4 mt-12 pt-6 border-t border-slate-50">
        <button
          (click)="onClose.emit()"
          [disabled]="isSaving()"
          class="px-8 py-3.5 font-bold text-slate-400 hover:text-slate-600 transition-all disabled:opacity-50"
        >
          Cancelar
        </button>
        <button
          (click)="saveChanges()"
          [disabled]="isSaving()"
          class="px-10 py-3.5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-black hover:-translate-y-0.5 transition-all flex items-center gap-3 disabled:opacity-50 disabled:translate-y-0"
        >
          @if (isSaving()) {
            <i class="fas fa-circle-notch animate-spin"></i>
            Procesando...
          } @else {
            <i class="fas fa-save opacity-50"></i>
            Guardar Cambios
          }
        </button>
      </div>
    </div>
  </div>
</div>
