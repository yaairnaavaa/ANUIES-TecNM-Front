<!-- BOTÓN MOBILE -->
<button
  (click)="toggleSidebar()"
  class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0f213e] text-white rounded-lg shadow-lg"
>
  <i class="fas fa-bars text-xl"></i>
</button>

<!-- OVERLAY -->
@if (isOpen()) {
  <div
    (click)="toggleSidebar()"
    class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm transition-opacity"
  ></div>
}

<!-- SIDEBAR -->
<aside
  [class.translate-x-0]="isOpen()"
  class="fixed inset-y-0 left-0 z-40 w-72 h-screen bg-[#0f213e] flex flex-col text-slate-300 shadow-xl font-sans transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 lg:static"
>
  <!-- HEADER -->
  <div class="p-6 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">
      <div
        class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-[#0f213e] font-bold text-xl shadow-inner"
      >
        TN
      </div>
      <div class="leading-tight">
        <h1 class="text-white font-bold text-lg leading-4">Articulación<br />EMS-TecNM</h1>
        <span class="text-[10px] text-slate-400 uppercase tracking-wider">
          Sistema Institucional
        </span>
      </div>
    </div>

    <button (click)="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white">
      <i class="fas fa-times text-xl"></i>
    </button>
  </div>

  <div class="border-t border-slate-700/50 mx-6 mb-4 shrink-0"></div>

  <!-- NAV -->
  <nav class="flex-1 min-h-0 overflow-y-auto px-4 pr-1 custom-scrollbar">
    @for (section of menuSections(); track section.title) {
      <div class="mb-6">
        <h3 class="px-4 text-[11px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-2">
          {{ section.title }}
        </h3>

        <div class="space-y-1">
          @for (item of section.items; track item.routerLink) {
            <a
              [routerLink]="item.routerLink"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="isOpen() ? toggleSidebar() : null"
              routerLinkActive="bg-[#1e2f4d] text-white border-l-4 border-emerald-500 rounded-r-lg"
              class="flex items-center justify-between px-4 py-3 hover:bg-[#1e2f4d] hover:text-white rounded-lg transition-all group"
            >
              <div class="flex items-center space-x-3">
                <i
                  [class]="item.icon"
                  class="text-lg w-6 text-slate-400 group-hover:text-emerald-400 transition-colors"
                ></i>
                <span class="text-sm font-medium">{{ item.label }}</span>
              </div>
            </a>
          }
        </div>
      </div>
    }
  </nav>

  <!-- FOOTER -->
  <div class="p-4 border-t border-slate-700/50 shrink-0">
    <div class="flex items-center space-x-3 p-2 bg-[#1e2f4d]/30 rounded-2xl border border-white/5">
      <div
        class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-bold"
      >
        {{ userInitials() }}
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold text-white truncate">{{ userName() }}</p>
        <p class="text-xs text-slate-400 truncate">{{ userRole() }}</p>
      </div>

      <button
        (click)="logout()"
        class="p-2 hover:bg-red-600/20 rounded-lg transition-colors group"
        title="Cerrar sesión"
      >
        <i
          class="fas fa-sign-out-alt text-slate-400 group-hover:text-red-400 transition-colors"
        ></i>
      </button>
    </div>
  </div>
</aside>
