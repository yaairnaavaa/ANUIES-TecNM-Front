<div class="flex items-center justify-center w-full max-w-2xl mx-auto px-2 py-6">
  <div class="flex items-center gap-1.5 md:gap-3 shrink-0">
    <div
      [ngClass]="
        currentStep >= 1
          ? 'bg-white text-[#1a2e4c] ring-4 ring-white/20'
          : 'bg-white/20 text-white/60'
      "
      class="w-7 h-7 md:w-10 md:h-10 rounded-full flex items-center justify-center text-xs md:text-base font-bold transition-all duration-300"
    >
      1
    </div>
    <span
      [ngClass]="currentStep >= 1 ? 'text-white font-bold' : 'text-white/50'"
      class="hidden sm:inline text-xs md:text-sm whitespace-nowrap"
    >
      Datos
    </span>
  </div>

  <div class="flex-1 mx-2 h-[2px] bg-white/20 relative">
    <div
      class="absolute inset-0 bg-white transition-all duration-500"
      [style.width]="currentStep > 1 ? '100%' : '0%'"
    ></div>
  </div>

  <div class="flex items-center gap-1.5 md:gap-3 shrink-0">
    <div
      [ngClass]="
        currentStep >= 2
          ? 'bg-white text-[#1a2e4c] ring-4 ring-white/20'
          : 'bg-white/20 text-white/60'
      "
      class="w-7 h-7 md:w-10 md:h-10 rounded-full flex items-center justify-center text-xs md:text-base font-bold transition-all duration-300"
    >
      2
    </div>
    <span
      [ngClass]="currentStep >= 2 ? 'text-white font-bold' : 'text-white/50'"
      class="hidden sm:inline text-xs md:text-sm whitespace-nowrap"
    >
      Intereses
    </span>
  </div>

  <div class="flex-1 mx-2 h-[2px] bg-white/20 relative">
    <div
      class="absolute inset-0 bg-white transition-all duration-500"
      [style.width]="currentStep > 2 ? '100%' : '0%'"
    ></div>
  </div>

  <div class="flex items-center gap-1.5 md:gap-3 shrink-0">
    <div
      [ngClass]="
        currentStep >= 3
          ? 'bg-white text-[#1a2e4c] ring-4 ring-white/20'
          : 'bg-white/20 text-white/60'
      "
      class="w-7 h-7 md:w-10 md:h-10 rounded-full flex items-center justify-center text-xs md:text-base font-bold transition-all duration-300"
    >
      3
    </div>
    <span
      [ngClass]="currentStep >= 3 ? 'text-white font-bold' : 'text-white/50'"
      class="hidden sm:inline text-xs md:text-sm whitespace-nowrap"
    >
      Confirmar
    </span>
  </div>
</div>
