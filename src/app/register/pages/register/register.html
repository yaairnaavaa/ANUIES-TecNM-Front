<div class="min-h-screen bg-[#1a2e4c] flex flex-col">
  
  <app-navbar></app-navbar>

  <div class="flex-1 flex flex-col items-center p-4 md:p-8">
    
    <app-stepper [currentStep]="activeStep" class="w-full max-w-2xl mb-8"></app-stepper>

    <div class="w-full flex justify-center">
      
      @if (activeStep === 1) {
        <app-registration-form></app-registration-form>
      }

      @if (activeStep === 2) {
        <div class="bg-white rounded-[2.5rem] p-10 shadow-2xl w-full max-w-3xl text-center">
          <h2 class="text-2xl font-bold mb-4 text-gray-800">Interests Section</h2>
          <p class="text-gray-500 mb-6">Choose your academic interests here...</p>
          <button (click)="goToPreviousStep()" class="text-blue-600 font-bold px-6 py-2">Back</button>
          <button (click)="goToNextStep()" class="bg-blue-600 text-white px-8 py-3 rounded-xl ml-4">Continue</button>
        </div>
      }

      @if (activeStep === 3) {
        <div class="bg-white rounded-[2.5rem] p-10 shadow-2xl w-full max-w-3xl text-center">
          <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
          <h2 class="text-2xl font-bold text-gray-800">Successful Registration!</h2>
          <p class="text-gray-500 mt-2">Welcome to TecNM.</p>
        </div>
      }

    </div>
  </div>
</div>
